<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>BDN.BET</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="topo">
      <div class="logo">BDN.GAMES</div>

      <div class="info">
        <span>4523 jogadores nas salas</span>
        <div class="linha"></div>
      </div>
    </div>

    <nav>
      <a href="https://www.youtube.com/">Jogar</a>
      <a href="#">Nossos Jogos</a>
      <a href="#">Nossos Aplicativos</a>
      <a href="#">Mais</a>
    </nav>
  </header>

  <main>
    <section class="conteudo">
      <h2>
        Jogue On-line sozinho e com seus amigos na BDN! 
        Divirta-se com Crash, Roleta e muito mais
      </h2>

      <div class="jogos">
        <div class="card">
          <img src="aviao.png" alt="Jogo Crash">
        </div>

        <div class="card">
          <img src="blocos.png" alt="Jogo de blocos">
        </div>

        <div class="card">
          <img src="cartas.png" alt="Jogo de cartas">
        </div>
      </div>
    </section>
  </main>

</body>
</html>
